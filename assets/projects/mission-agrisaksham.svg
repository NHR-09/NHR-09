<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="100%" height="100%">
  <defs>
    <linearGradient id="m3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D18" />
      <stop offset="100%" stop-color="#04060B" />
    </linearGradient>

    <filter id="m3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes audioPulse {
        0%, 100% { height: 6px; y: 102px; }
        50% { height: 28px; y: 91px; }
      }
      .bar-a { animation: audioPulse 1.2s ease-in-out infinite; }
      .bar-b { animation: audioPulse 1.2s ease-in-out infinite 0.3s; }
      .bar-c { animation: audioPulse 1.2s ease-in-out infinite 0.6s; }
      @media (prefers-reduced-motion: reduce) {
        .bar-a, .bar-b, .bar-c { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="476" height="226" rx="10" fill="url(#m3Bg)" stroke="#1B2438" stroke-width="1.6" />

  <!-- Top Strip / Mission Index -->
  <path d="M 2 10 C 2 5.5 5.5 2 10 2 L 470 2 C 474.5 2 478 5.5 478 10 L 478 28 L 2 28 Z" fill="#101726" />
  <rect x="2" y="2" width="115" height="26" rx="4" fill="#FF1E46" />
  <text x="59" y="19" font-family="'Impact', 'Arial Black', sans-serif" font-size="11.5" font-weight="900" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">
    MISSION // 03
  </text>

  <text x="465" y="19" font-family="'Courier New', monospace" font-size="10.5" font-weight="700" fill="#00F0FF" text-anchor="end">
    [AI VISION · NEURAL VOICE]
  </text>

  <!-- Project Title -->
  <text x="24" y="60" font-family="'Impact', 'Arial Black', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="0.8">
    AGRISAKSHAM
  </text>
  <text x="24" y="78" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#00F0FF" letter-spacing="0.5">
    AI-Powered Agricultural Intelligence Assistant
  </text>

  <!-- Short Description -->
  <text x="24" y="104" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#93A2B7">
    Crop pathology diagnostics, fertilizer recommendation,
  </text>
  <text x="24" y="122" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#93A2B7">
    and offline voice-driven dialogue powered by ML &amp; Vosk.
  </text>

  <!-- Tech Stack Badges Row -->
  <g transform="translate(24, 142)">
    <rect x="0" y="0" width="58" height="20" rx="3" fill="#141E30" stroke="#FF1E46" stroke-width="0.8" />
    <text x="29" y="13.5" font-family="'SF Pro Display', sans-serif" font-size="9.5" font-weight="700" fill="#F0F4F8" text-anchor="middle">Python</text>

    <rect x="64" y="0" width="76" height="20" rx="3" fill="#141E30" stroke="#00F0FF" stroke-width="0.8" />
    <text x="102" y="13.5" font-family="'SF Pro Display', sans-serif" font-size="9.5" font-weight="700" fill="#F0F4F8" text-anchor="middle">TensorFlow</text>

    <rect x="146" y="0" width="80" height="20" rx="3" fill="#141E30" stroke="#374863" stroke-width="0.8" />
    <text x="186" y="13.5" font-family="'SF Pro Display', sans-serif" font-size="9.5" font-weight="700" fill="#F0F4F8" text-anchor="middle">Scikit-Learn</text>

    <rect x="232" y="0" width="50" height="20" rx="3" fill="#141E30" stroke="#374863" stroke-width="0.8" />
    <text x="257" y="13.5" font-family="'SF Pro Display', sans-serif" font-size="9.5" font-weight="700" fill="#F0F4F8" text-anchor="middle">Flask</text>

    <rect x="288" y="0" width="48" height="20" rx="3" fill="#141E30" stroke="#00F0FF" stroke-width="0.8" />
    <text x="312" y="13.5" font-family="'SF Pro Display', sans-serif" font-size="9.5" font-weight="700" fill="#F0F4F8" text-anchor="middle">Vosk</text>
  </g>

  <!-- Right Visual: Voice Waveform & AI Scanner HUD -->
  <g transform="translate(385, 105)">
    <!-- Scanning Circle -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#25354E" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="18" fill="#101826" stroke="#FF1E46" stroke-width="1" />

    <!-- Neural Audio Bars -->
    <rect x="-14" y="102" width="4" height="10" rx="2" fill="#00F0FF" class="bar-a" />
    <rect x="-7" y="102" width="4" height="16" rx="2" fill="#FF1E46" class="bar-b" />
    <rect x="0" y="102" width="4" height="24" rx="2" fill="#FFFFFF" class="bar-c" />
    <rect x="7" y="102" width="4" height="16" rx="2" fill="#FF1E46" class="bar-b" />
    <rect x="14" y="102" width="4" height="10" rx="2" fill="#00F0FF" class="bar-a" />

    <!-- Scanner Target Marks -->
    <path d="M -24 0 L -18 0 M 24 0 L 18 0 M 0 -24 L 0 -18 M 0 24 L 0 18" stroke="#00F0FF" stroke-width="1.4" />
  </g>

  <!-- Action Bar at Bottom -->
  <line x1="2" y1="182" x2="478" y2="182" stroke="#1B2438" stroke-width="1" />
  <text x="24" y="206" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#FF1E46">
    &gt;&gt; REPO: Krishna-yamsalwar/AgriSakhsham
  </text>
  <g transform="translate(370, 192)">
    <rect x="0" y="0" width="90" height="24" rx="4" fill="#131B2D" stroke="#00F0FF" stroke-width="1" />
    <text x="45" y="16" font-family="'SF Pro Display', sans-serif" font-size="10.5" font-weight="800" fill="#00F0FF" text-anchor="middle" letter-spacing="0.8">VIEW ↗</text>
  </g>

  <!-- Corner Notch Accent -->
  <polygon points="478,228 464,228 478,214" fill="#FF1E46" />
</svg>
