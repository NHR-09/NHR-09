<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="100%" height="100%">
  <defs>
    <linearGradient id="m2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D18" />
      <stop offset="100%" stop-color="#04060B" />
    </linearGradient>

    <filter id="m2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes rotateRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .solana-ring { transform-origin: 385px 105px; animation: rotateRing 14s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .solana-ring { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="476" height="226" rx="10" fill="url(#m2Bg)" stroke="#1B2438" stroke-width="1.6" />

  <!-- Top Blue/Cyan Strip / Mission Index -->
  <path d="M 2 10 C 2 5.5 5.5 2 10 2 L 470 2 C 474.5 2 478 5.5 478 10 L 478 28 L 2 28 Z" fill="#101726" />
  <rect x="2" y="2" width="115" height="26" rx="4" fill="#00F0FF" />
  <text x="59" y="19" font-family="'Impact', 'Arial Black', sans-serif" font-size="11.5" font-weight="900" fill="#040711" letter-spacing="1.5" text-anchor="middle">
    MISSION // 02
  </text>

  <text x="465" y="19" font-family="'Courier New', monospace" font-size="10.5" font-weight="700" fill="#FF1E46" text-anchor="end">
    [SOLANA · PROTOCOL]
  </text>

  <!-- Project Title -->
  <text x="24" y="60" font-family="'Impact', 'Arial Black', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="0.8">
    EVENTIX
  </text>
  <text x="24" y="78" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FF1E46" letter-spacing="0.5">
    Blockchain Event Ticketing Protocol
  </text>

  <!-- Short Description -->
  <text x="24" y="104" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#93A2B7">
    Decentralized anti-scalping event ticketing engine
  </text>
  <text x="24" y="122" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#93A2B7">
    powered by Solana NFTs, Rust smart contracts, &amp; IPFS.
  </text>

  <!-- Tech Stack Badges Row -->
  <g transform="translate(24, 142)">
    <rect x="0" y="0" width="58" height="20" rx="3" fill="#141E30" stroke="#00F0FF" stroke-width="0.8" />
    <text x="29" y="13.5" font-family="'SF Pro Display', sans-serif" font-size="9.5" font-weight="700" fill="#F0F4F8" text-anchor="middle">Solana</text>

    <rect x="64" y="0" width="48" height="20" rx="3" fill="#141E30" stroke="#FF1E46" stroke-width="0.8" />
    <text x="88" y="13.5" font-family="'SF Pro Display', sans-serif" font-size="9.5" font-weight="700" fill="#F0F4F8" text-anchor="middle">Rust</text>

    <rect x="118" y="0" width="56" height="20" rx="3" fill="#141E30" stroke="#374863" stroke-width="0.8" />
    <text x="146" y="13.5" font-family="'SF Pro Display', sans-serif" font-size="9.5" font-weight="700" fill="#F0F4F8" text-anchor="middle">Anchor</text>

    <rect x="180" y="0" width="46" height="20" rx="3" fill="#141E30" stroke="#374863" stroke-width="0.8" />
    <text x="203" y="13.5" font-family="'SF Pro Display', sans-serif" font-size="9.5" font-weight="700" fill="#F0F4F8" text-anchor="middle">IPFS</text>

    <rect x="232" y="0" width="58" height="20" rx="3" fill="#141E30" stroke="#00F0FF" stroke-width="0.8" />
    <text x="261" y="13.5" font-family="'SF Pro Display', sans-serif" font-size="9.5" font-weight="700" fill="#F0F4F8" text-anchor="middle">Node.js</text>
  </g>

  <!-- Right Visual: Solana Decentralized Token Network -->
  <g transform="translate(0, 0)">
    <!-- Rotating Token Ring -->
    <g class="solana-ring">
      <circle cx="385" cy="105" r="32" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.6" />
      <circle cx="385" cy="105" r="22" fill="none" stroke="#FF1E46" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
      <polygon points="385,71 389,75 385,79 381,75" fill="#00F0FF" />
      <polygon points="385,131 389,135 385,139 381,135" fill="#FF1E46" />
    </g>
    <!-- Center Solana-styled Slanted Parallelograms -->
    <g transform="translate(385, 105)">
      <polygon points="-14,-10 10,-10 14,-6 -10,-6" fill="#00F0FF" filter="url(#m2Glow)" />
      <polygon points="-12,-2 12,-2 8,2 -16,2" fill="#FFFFFF" />
      <polygon points="-10,6 14,6 10,10 -14,10" fill="#FF1E46" filter="url(#m2Glow)" />
    </g>
  </g>

  <!-- Action Bar at Bottom -->
  <line x1="2" y1="182" x2="478" y2="182" stroke="#1B2438" stroke-width="1" />
  <text x="24" y="206" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#00F0FF">
    &gt;&gt; LIVE: eventix-blockchain.web.app
  </text>
  <g transform="translate(370, 192)">
    <rect x="0" y="0" width="90" height="24" rx="4" fill="#131B2D" stroke="#FF1E46" stroke-width="1" />
    <text x="45" y="16" font-family="'SF Pro Display', sans-serif" font-size="10.5" font-weight="800" fill="#FF1E46" text-anchor="middle" letter-spacing="0.8">DEMO ↗</text>
  </g>

  <!-- Corner Notch Accent -->
  <polygon points="478,228 464,228 478,214" fill="#00F0FF" />
</svg>
