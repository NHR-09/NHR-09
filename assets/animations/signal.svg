<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="100%" height="100%">
  <defs>
    <linearGradient id="signalBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0E1424" />
      <stop offset="100%" stop-color="#080C16" />
    </linearGradient>

    <filter id="sigGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes radarWave {
        0% { r: 6px; opacity: 1; }
        100% { r: 24px; opacity: 0; }
      }
      @keyframes blinkBeacon {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes scanGlitch {
        0%, 94%, 100% { transform: translateY(0); }
        95% { transform: translateY(1px); }
        97% { transform: translateY(-1px); }
      }
      .wave-1 { animation: radarWave 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite; }
      .wave-2 { animation: radarWave 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite 0.7s; }
      .beacon { animation: blinkBeacon 1.2s ease-in-out infinite; }
      .hud-text { animation: scanGlitch 6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .wave-1, .wave-2, .beacon, .hud-text { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Main Background Container -->
  <rect x="2" y="2" width="996" height="66" rx="8" fill="url(#signalBg)" stroke="#1F2A3F" stroke-width="1.5" />
  
  <!-- Corner Comic Notches -->
  <polygon points="2,2 14,2 2,14" fill="#FF1E46" />
  <polygon points="998,2 986,2 998,14" fill="#00F0FF" />
  <polygon points="2,68 14,68 2,56" fill="#00F0FF" />
  <polygon points="998,68 986,68 998,56" fill="#FF1E46" />

  <!-- Left: Animated Spider-Sense Radar -->
  <g transform="translate(50, 35)">
    <!-- Expanding Waves -->
    <circle cx="0" cy="0" r="6" fill="none" stroke="#FF1E46" stroke-width="1.8" class="wave-1" />
    <circle cx="0" cy="0" r="6" fill="none" stroke="#00F0FF" stroke-width="1.5" class="wave-2" />
    <!-- Center Core Dot -->
    <circle cx="0" cy="0" r="5" fill="#FF1E46" filter="url(#sigGlow)" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>

  <!-- Status HUD Details (Center Left) -->
  <g class="hud-text" transform="translate(90, 42)">
    <text x="0" y="0" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
      SPIDER-SENSE // <tspan fill="#00F0FF">ACTIVE</tspan>
    </text>
    <text x="210" y="-1" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#FF1E46">
      [FREQ: 104.9 MHz]
    </text>
    <text x="360" y="-1" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8FA0BC" letter-spacing="0.8">
      LOC: PUNE, IN (411037) · CLASS: AI/ML &amp; SYSTEMS
    </text>
  </g>

  <!-- Right: Telemetry & Beacon -->
  <g transform="translate(820, 42)">
    <!-- Battery / Fuel Bar -->
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="11.5" font-weight="800" fill="#00F0FF" letter-spacing="0.5">
      GRID: 100% ████████
    </text>
    <!-- Status Beacon -->
    <g transform="translate(130, -5)" class="beacon">
      <circle cx="0" cy="0" r="4.5" fill="#00F0FF" filter="url(#sigGlow)" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
  </g>
</svg>
