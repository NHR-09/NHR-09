<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>

    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanSweep {
        0% { transform: translateY(-40px); }
        100% { transform: translateY(200px); }
      }
      .cursor-blink { animation: blinkCursor 0.9s infinite; }
      .scan-sweep { animation: scanSweep 4s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .cursor-blink, .scan-sweep { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Terminal Window Outer Frame -->
  <rect x="2" y="2" width="996" height="186" rx="8" fill="url(#termBg)" stroke="#1C273C" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <path d="M 2 10 C 2 5.5 5.5 2 10 2 L 990 2 C 994.5 2 998 5.5 998 10 L 998 32 L 2 32 Z" fill="#0E1524" />
  <line x1="2" y1="32" x2="998" y2="32" stroke="#1C273C" stroke-width="1" />

  <!-- Window Dots / LEDs -->
  <circle cx="22" cy="17" r="4.5" fill="#FF1E46" />
  <circle cx="38" cy="17" r="4.5" fill="#FFB703" />
  <circle cx="54" cy="17" r="4.5" fill="#00F0FF" />

  <text x="75" y="21" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#7C8FA8" letter-spacing="1">
    SPIDER_SYS // TERMINAL_HUD v2.9 · [PUNE_NODE_SECURE]
  </text>

  <text x="965" y="21" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#00F0FF" text-anchor="end">
    LIVE TRANSMISSION
  </text>

  <!-- Scanning Sweep Beam -->
  <g class="scan-sweep">
    <rect x="2" y="0" width="996" height="35" fill="url(#scanlineGrad)" />
  </g>

  <!-- Console Log Stream -->
  <g transform="translate(30, 60)" font-family="'Courier New', Courier, monospace" font-size="13.5">
    <!-- Line 1 -->
    <text x="0" y="0" fill="#4B6382">
      <tspan fill="#FF1E46" font-weight="bold">[root@spidey-net ~]$</tspan> initialize_agent --profile="NHR-09" --mode="SUPERHERO_DEV"
    </text>

    <!-- Line 2 -->
    <text x="0" y="26" fill="#8FA0BC">
      <tspan fill="#00F0FF" font-weight="bold">&gt;&gt; IDENTITY VERIFIED:</tspan> Nihar Mehakare // AI/ML Engineer &amp; Full-Stack Builder
    </text>

    <!-- Line 3 -->
    <text x="0" y="52" fill="#8FA0BC">
      <tspan fill="#00F0FF" font-weight="bold">&gt;&gt; DIRECTIVE:</tspan> Engineering RAG architectures, knowledge graphs, and decentralized protocols
    </text>

    <!-- Line 4 -->
    <text x="0" y="78" fill="#F0F4F8" font-weight="bold">
      <tspan fill="#FF1E46">&gt;&gt; TAGLINE:</tspan> "lets do this one last time yo ," <tspan fill="#00F0FF" class="cursor-blink">█</tspan>
    </text>

    <!-- Line 5 (Sub status) -->
    <text x="0" y="104" font-size="11.5" fill="#3D506B">
      // PROTOCOL READY · ALL SPIDER-SENSES CALIBRATED · 0 CRITICAL ANOMALIES
    </text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 6 170 L 6 182 L 18 182" fill="none" stroke="#FF1E46" stroke-width="1.8" />
  <path d="M 994 170 L 994 182 L 982 182" fill="none" stroke="#00F0FF" stroke-width="1.8" />
</svg>
