<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="100%" height="100%">
  <defs>
    <linearGradient id="thwipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E46" />
      <stop offset="100%" stop-color="#FF597B" />
    </linearGradient>

    <filter id="thwipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes thwipShake {
        0%, 90%, 100% { transform: translate(0, 0) rotate(-4deg); }
        92% { transform: translate(-2px, -2px) rotate(-3deg); }
        94% { transform: translate(2px, 1px) rotate(-5deg); }
        96% { transform: translate(-1px, 2px) rotate(-4deg); }
      }
      @keyframes webSpurt {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 15; }
      }
      .thwip-burst { transform-origin: 100px 45px; animation: thwipShake 3.5s ease-in-out infinite; }
      .web-spurt { stroke-dasharray: 8 6; animation: webSpurt 1.8s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .thwip-burst, .web-spurt { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Web Spurt Lines from Web-Shooter -->
  <g class="web-spurt" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 170 45 Q 260 20 380 35" />
    <path d="M 175 48 Q 280 50 390 55" />
    <path d="M 165 42 Q 250 68 375 75" />
  </g>

  <!-- Comic Action Explosive Burst Cloud -->
  <g class="thwip-burst">
    <!-- Offset Glitch Shadow -->
    <polygon points="40,25 65,10 85,22 110,8 125,26 155,18 145,45 165,58 140,70 148,88 120,78 98,92 82,74 55,85 62,60 30,50"
             fill="#00F0FF"
             opacity="0.45"
             transform="translate(2, 2)" />

    <!-- Main Crimson Comic Starburst -->
    <polygon points="40,25 65,10 85,22 110,8 125,26 155,18 145,45 165,58 140,70 148,88 120,78 98,92 82,74 55,85 62,60 30,50"
             fill="url(#thwipGrad)"
             stroke="#FFFFFF"
             stroke-width="2"
             filter="url(#thwipGlow)" />

    <!-- Comic Onomatopoeia: THWIP! -->
    <text x="96" y="58"
          font-family="'Impact', 'Arial Black', sans-serif"
          font-size="34"
          font-weight="900"
          fill="#FFFFFF"
          stroke="#000000"
          stroke-width="1.8"
          letter-spacing="2"
          text-anchor="middle">
      THWIP!
    </text>
  </g>

  <!-- Web-Shooter Wrist Nozzle Icon -->
  <circle cx="28" cy="45" r="14" fill="#0E1524" stroke="#00F0FF" stroke-width="2" />
  <circle cx="28" cy="45" r="5" fill="#FF1E46" />
</svg>
