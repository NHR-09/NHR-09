<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 106 24" height="24">
  <defs>
    <style>
      .link-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; fill: #D0D7DE; transition: fill 0.2s; }
      .link-icon { transition: opacity 0.2s; }
      svg:hover .link-text { fill: #E52E2E; }
      svg:hover .link-icon { opacity: 0.85; }
    </style>
  </defs>
  <g class="link-icon" transform="translate(0, 3)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </g>
  <text x="26" y="16" class="link-text">Telegram</text>
</svg>
