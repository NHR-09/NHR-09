<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="100%">
  <defs>
    <style>
      @keyframes breathe {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.85; }
      }
      .node-glow { animation: breathe 4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .node-glow { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Hairline Divider -->
  <line x1="0" y1="12" x2="430" y2="12" stroke="#1D222D" stroke-width="1" />
  <line x1="470" y1="12" x2="900" y2="12" stroke="#1D222D" stroke-width="1" />

  <!-- Center Minimalist Spider/Geometric Node -->
  <g transform="translate(450, 12)">
    <circle cx="0" cy="0" r="3.5" fill="#0E1219" stroke="#252D3D" stroke-width="1.2" />
    <circle cx="0" cy="0" r="1.8" fill="#D92534" class="node-glow" />
  </g>
</svg>
