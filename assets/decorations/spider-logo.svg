<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="spiderSprayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E46" />
      <stop offset="70%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#990022" />
    </linearGradient>

    <filter id="spiderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes spiderHover {
        0%, 100% { transform: translateY(0px); filter: drop-shadow(0 0 8px rgba(255, 30, 70, 0.4)); }
        50% { transform: translateY(-4px); filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.7)) drop-shadow(0 0 20px rgba(255, 30, 70, 0.6)); }
      }
      .spider-body { animation: spiderHover 4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .spider-body { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background Subtle Circular Grid -->
  <circle cx="120" cy="120" r="110" fill="#0A0D15" stroke="#1A2234" stroke-width="2" />
  <circle cx="120" cy="120" r="85" fill="none" stroke="#232E45" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="120" cy="120" r="55" fill="none" stroke="#FF1E46" stroke-width="0.8" opacity="0.35" />

  <!-- Radiating Web Strands -->
  <g stroke="#26334D" stroke-width="1" opacity="0.45">
    <line x1="120" y1="10" x2="120" y2="230" />
    <line x1="10" y1="120" x2="230" y2="120" />
    <line x1="42" y1="42" x2="198" y2="198" />
    <line x1="198" y1="42" x2="42" y2="198" />
  </g>

  <!-- Spray Paint Splatter Accents (Miles Morales Stencil Style) -->
  <g fill="#FF1E46" opacity="0.75">
    <circle cx="55" cy="80" r="2" />
    <circle cx="62" cy="72" r="1.2" />
    <circle cx="180" cy="75" r="2" />
    <circle cx="190" cy="84" r="1.5" />
    <circle cx="70" cy="165" r="2" />
    <circle cx="60" cy="175" r="1" />
    <circle cx="175" cy="160" r="2.2" />
    <circle cx="185" cy="170" r="1.4" />
    <circle cx="120" cy="35" r="1.5" />
    <circle cx="120" cy="205" r="1.8" />
  </g>

  <!-- Electric Cyan Glitch Shadow (Offset Layer) -->
  <g transform="translate(122, 121)" opacity="0.45" fill="#00F0FF">
    <!-- Center Thorax & Abdomen -->
    <path d="M 0 -28 L 8 -14 L 18 -18 L 10 -4 L 20 8 L 10 12 L 16 34 L 6 24 L 0 32 L -6 24 L -16 34 L -10 12 L -20 8 L -10 -4 L -18 -18 L -8 -14 Z" />
    <!-- Upper Legs Left -->
    <path d="M -6 -16 C -25 -40 -60 -45 -75 -25 C -78 -20 -70 -16 -68 -20 C -56 -36 -28 -30 -12 -12 Z" />
    <path d="M -8 -8 C -35 -24 -70 -20 -82 5 C -84 10 -76 12 -74 8 C -65 -12 -36 -14 -14 -2 Z" />
    <!-- Lower Legs Left -->
    <path d="M -8 8 C -35 24 -68 30 -78 55 C -80 60 -72 62 -70 58 C -62 36 -35 28 -12 12 Z" />
    <path d="M -6 16 C -25 38 -55 58 -65 85 C -67 90 -59 92 -57 88 C -48 64 -24 45 -8 20 Z" />
    <!-- Upper Legs Right -->
    <path d="M 6 -16 C 25 -40 60 -45 75 -25 C 78 -20 70 -16 68 -20 C 56 -36 28 -30 12 -12 Z" />
    <path d="M 8 -8 C 35 -24 70 -20 82 5 C 84 10 76 12 74 8 C 65 -12 36 -14 14 -2 Z" />
    <!-- Lower Legs Right -->
    <path d="M 8 8 C 35 24 68 30 78 55 C 80 60 72 62 70 58 C 62 36 35 28 12 12 Z" />
    <path d="M 6 16 C 25 38 55 58 65 85 C 67 90 59 92 57 88 C 48 64 24 45 8 20 Z" />
  </g>

  <!-- Main Miles Morales Stencil Spider (Crimson & Vivid Red) -->
  <g class="spider-body" transform="translate(120, 120)" filter="url(#spiderGlow)">
    <!-- Main Center Body (Angular / Geometric) -->
    <path d="M 0 -28
             L 8 -14
             L 18 -18
             L 10 -4
             L 20 8
             L 10 12
             L 16 34
             L 6 24
             L 0 32
             L -6 24
             L -16 34
             L -10 12
             L -20 8
             L -10 -4
             L -18 -18
             L -8 -14 Z"
          fill="url(#spiderSprayGrad)"
          stroke="#FFFFFF"
          stroke-width="1.2" />

    <!-- Center White Diamond -->
    <polygon points="0,-8 5,0 0,8 -5,0" fill="#FFFFFF" />

    <!-- Upper Legs Left -->
    <path d="M -6 -16 C -25 -40 -60 -45 -75 -25 C -78 -20 -70 -16 -68 -20 C -56 -36 -28 -30 -12 -12 Z"
          fill="url(#spiderSprayGrad)" />
    <path d="M -8 -8 C -35 -24 -70 -20 -82 5 C -84 10 -76 12 -74 8 C -65 -12 -36 -14 -14 -2 Z"
          fill="url(#spiderSprayGrad)" />

    <!-- Lower Legs Left -->
    <path d="M -8 8 C -35 24 -68 30 -78 55 C -80 60 -72 62 -70 58 C -62 36 -35 28 -12 12 Z"
          fill="url(#spiderSprayGrad)" />
    <path d="M -6 16 C -25 38 -55 58 -65 85 C -67 90 -59 92 -57 88 C -48 64 -24 45 -8 20 Z"
          fill="url(#spiderSprayGrad)" />

    <!-- Upper Legs Right -->
    <path d="M 6 -16 C 25 -40 60 -45 75 -25 C 78 -20 70 -16 68 -20 C 56 -36 28 -30 12 -12 Z"
          fill="url(#spiderSprayGrad)" />
    <path d="M 8 -8 C 35 -24 70 -20 82 5 C 84 10 76 12 74 8 C 65 -12 36 -14 14 -2 Z"
          fill="url(#spiderSprayGrad)" />

    <!-- Lower Legs Right -->
    <path d="M 8 8 C 35 24 68 30 78 55 C 80 60 72 62 70 58 C 62 36 35 28 12 12 Z"
          fill="url(#spiderSprayGrad)" />
    <path d="M 6 16 C 25 38 55 58 65 85 C 67 90 59 92 57 88 C 48 64 24 45 8 20 Z"
          fill="url(#spiderSprayGrad)" />
  </g>

  <!-- Stencil Frame Marks -->
  <path d="M 15 25 L 25 25 L 25 15" fill="none" stroke="#FF1E46" stroke-width="2" />
  <path d="M 225 25 L 215 25 L 215 15" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 15 215 L 25 215 L 25 225" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 225 215 L 215 215 L 215 225" fill="none" stroke="#FF1E46" stroke-width="2" />
</svg>
