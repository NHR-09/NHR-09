<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="100%" height="100%">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E46" stop-opacity="0" />
      <stop offset="20%" stop-color="#FF1E46" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="80%" stop-color="#FF1E46" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <filter id="webGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes webTravel {
        0% { transform: translateX(-150px); opacity: 0; }
        30% { opacity: 1; }
        70% { opacity: 1; }
        100% { transform: translateX(1150px); opacity: 0; }
      }
      @keyframes pulseCenter {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(255, 30, 70, 0.6)); }
        50% { transform: scale(1.18); filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.9)); }
      }
      .laser-pulse { animation: webTravel 4s linear infinite; }
      .center-spider-node { transform-origin: 500px 20px; animation: pulseCenter 2.5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .laser-pulse, .center-spider-node { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Base Subtle Guide Line -->
  <line x1="50" y1="20" x2="950" y2="20" stroke="#161F30" stroke-width="1.5" />

  <!-- Tensile Web Curves Spanning Sections -->
  <path d="M 50 20 Q 200 8 350 20 Q 425 28 500 20 Q 575 12 650 20 Q 800 32 950 20"
        fill="none"
        stroke="#23324C"
        stroke-width="1.2"
        stroke-dasharray="6 4" />

  <path d="M 120 20 Q 300 30 500 20 Q 700 10 880 20"
        fill="none"
        stroke="url(#dividerGrad)"
        stroke-width="1.6"
        opacity="0.75" />

  <!-- Animated Laser Spark Traversing the Web Strand -->
  <g class="laser-pulse" filter="url(#webGlow)">
    <circle cx="0" cy="20" r="3.5" fill="#00F0FF" />
    <line x1="-35" y1="20" x2="0" y2="20" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-65" y1="20" x2="-35" y2="20" stroke="#FF1E46" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Left Web Node -->
  <g transform="translate(180, 20)">
    <circle cx="0" cy="0" r="3.5" fill="#0A0E18" stroke="#FF1E46" stroke-width="1.5" />
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#FF1E46" stroke-width="1" />
  </g>

  <!-- Right Web Node -->
  <g transform="translate(820, 20)">
    <circle cx="0" cy="0" r="3.5" fill="#0A0E18" stroke="#00F0FF" stroke-width="1.5" />
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#00F0FF" stroke-width="1" />
  </g>

  <!-- Center Spider Emblem Glyph Node -->
  <g class="center-spider-node">
    <polygon points="500,8 514,20 500,32 486,20" fill="#080C16" stroke="#FF1E46" stroke-width="1.6" />
    <!-- Mini Spider Icon -->
    <path d="M 500 14 L 503 18 L 507 17 L 504 21 L 507 24 L 503 24 L 500 27 L 497 24 L 493 24 L 496 21 L 493 17 L 497 18 Z"
          fill="#00F0FF" />
    <circle cx="500" cy="20" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
