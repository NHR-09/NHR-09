<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 135" width="100%" height="100%">
  <defs>
    <style>
      @keyframes lineDraw {
        0% { transform: scaleX(0.92); opacity: 0.7; }
        50% { transform: scaleX(1); opacity: 1; }
        100% { transform: scaleX(0.92); opacity: 0.7; }
      }
      .accent-line { transform-origin: center center; animation: lineDraw 6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .accent-line { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Transparent Background -->
  <rect width="900" height="135" fill="transparent" />

  <!-- Main Identity: NHR-09 -->
  <g transform="translate(450, 64)">
    <text x="0" y="0"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Impact', sans-serif"
          font-size="64"
          font-weight="900"
          fill="#F4F6F9"
          letter-spacing="4"
          text-anchor="middle">
      NHR-09
    </text>
    <!-- Single Restrained Crimson Accent Bar Centered -->
    <rect x="-60" y="12" width="120" height="3" fill="#D92534" class="accent-line" rx="1.5" />
  </g>

  <!-- The Tagline: "lets do this one last time yo ," -->
  <g transform="translate(450, 116)">
    <text x="0" y="0"
          font-family="'Courier New', Courier, monospace"
          font-size="18"
          font-style="italic"
          font-weight="600"
          fill="#8E99A8"
          letter-spacing="0.5"
          text-anchor="middle">
      lets do this one last time yo ,
    </text>
  </g>
</svg>
