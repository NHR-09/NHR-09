<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <style>
      @keyframes softPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes lineDraw {
        0% { transform: scaleX(0.92); opacity: 0.6; }
        50% { transform: scaleX(1); opacity: 1; }
        100% { transform: scaleX(0.92); opacity: 0.6; }
      }
      .beacon-dot { animation: softPulse 3.5s ease-in-out infinite; }
      .accent-line { transform-origin: left center; animation: lineDraw 6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .beacon-dot, .accent-line { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Transparent / Seamless Dark Background -->
  <rect width="900" height="170" fill="transparent" />

  <!-- Issue Stamp -->
  <g transform="translate(0, 26)">
    <circle cx="4" cy="-4" r="3" fill="#D92534" class="beacon-dot" />
    <text x="16" y="0" font-family="'SF Mono', 'Courier New', monospace" font-size="11" font-weight="700" fill="#717D8F" letter-spacing="2">
      ISSUE // 09 · MARVELOUS / NOIR
    </text>
  </g>

  <!-- Main Identity: NHR-09 -->
  <g transform="translate(0, 92)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Impact', sans-serif" font-size="64" font-weight="900" fill="#F4F6F9" letter-spacing="3">
      NHR-09
    </text>
    <!-- Single Restrained Crimson Accent Bar -->
    <rect x="2" y="12" width="120" height="3" fill="#D92534" class="accent-line" rx="1.5" />
  </g>

  <!-- The Tagline: "lets do this one last time yo ," -->
  <g transform="translate(0, 142)">
    <text x="0" y="0" font-family="'Courier New', Courier, monospace" font-size="18" font-style="italic" font-weight="600" fill="#8E99A8" letter-spacing="0.5">
      lets do this one last time yo ,
    </text>
  </g>
</svg>
