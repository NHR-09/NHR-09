<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <!-- Dark Comic Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040508" />
      <stop offset="50%" stop-color="#090C15" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="redGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E46" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>

    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <linearGradient id="eyeReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#DDF2FD" />
      <stop offset="100%" stop-color="#89CFF0" />
    </linearGradient>

    <!-- Halftone Pattern -->
    <pattern id="halftoneDots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FF1E46" opacity="0.12" />
      <circle cx="10" cy="10" r="1" fill="#00F0FF" opacity="0.1" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="neonRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sensePulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-18px) translateX(8px); opacity: 0.85; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes spideyPulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.04); }
      }
      @keyframes eyeGlowAnim {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.45)); }
        50% { filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.95)) drop-shadow(0 0 24px rgba(255, 30, 70, 0.6)); }
      }
      @keyframes glitchShift {
        0%, 92%, 100% { transform: translate(0, 0); }
        93% { transform: translate(-2px, 1px); }
        95% { transform: translate(2px, -1px); }
        97% { transform: translate(-1px, 2px); }
      }
      @keyframes webShimmer {
        0%, 100% { stroke-opacity: 0.18; }
        50% { stroke-opacity: 0.55; }
      }
      .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
      .particle-3 { animation: floatParticle 6s ease-in-out infinite 3s; }
      .sense-wave { transform-origin: 780px 190px; animation: spideyPulse 3s ease-in-out infinite; }
      .eye-glow { animation: eyeGlowAnim 4s ease-in-out infinite; }
      .glitch-layer { animation: glitchShift 4.5s ease-in-out infinite; }
      .web-line { animation: webShimmer 4s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .particle-1, .particle-2, .particle-3, .sense-wave, .eye-glow, .glitch-layer, .web-line {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="420" fill="url(#skyGrad)" rx="16" />

  <!-- Halftone Overlay -->
  <rect width="1000" height="420" fill="url(#halftoneDots)" rx="16" />

  <!-- Diagonal Cyber Comic Cuts / Geometric Accents -->
  <path d="M -50 420 L 350 420 L 220 0 L -50 0 Z" fill="#FF1E46" opacity="0.03" />
  <path d="M 680 420 L 1050 420 L 1050 0 L 820 0 Z" fill="#00F0FF" opacity="0.025" />

  <!-- Distant City Skyline Silhouettes -->
  <g opacity="0.32">
    <!-- Far Buildings -->
    <rect x="520" y="210" width="42" height="210" fill="#0E1322" />
    <rect x="570" y="170" width="55" height="250" fill="#090E1A" />
    <rect x="635" y="240" width="38" height="180" fill="#0C111F" />
    <rect x="685" y="190" width="60" height="230" fill="#090D18" />
    <rect x="890" y="180" width="50" height="240" fill="#0A0F1D" />
    <rect x="945" y="220" width="60" height="200" fill="#0E1424" />
    <!-- Antennas / Towers -->
    <line x1="595" y1="170" x2="595" y2="135" stroke="#FF1E46" stroke-width="1.5" opacity="0.8" />
    <circle cx="595" cy="135" r="2.5" fill="#FF1E46" filter="url(#neonRedGlow)" />
    <line x1="715" y1="190" x2="715" y2="150" stroke="#00F0FF" stroke-width="1.5" opacity="0.8" />
    <circle cx="715" cy="150" r="2.5" fill="#00F0FF" filter="url(#neonCyanGlow)" />
    <line x1="915" y1="180" x2="915" y2="145" stroke="#FF1E46" stroke-width="1.5" opacity="0.8" />
    <!-- Tiny Cyber Windows -->
    <circle cx="585" cy="195" r="1.5" fill="#00F0FF" opacity="0.6" />
    <circle cx="605" cy="215" r="1.5" fill="#FF1E46" opacity="0.5" />
    <circle cx="605" cy="235" r="1.5" fill="#00F0FF" opacity="0.7" />
    <circle cx="540" cy="230" r="1.5" fill="#FFF" opacity="0.4" />
    <circle cx="700" cy="210" r="1.5" fill="#00F0FF" opacity="0.7" />
    <circle cx="725" cy="235" r="1.5" fill="#FF1E46" opacity="0.6" />
    <circle cx="910" cy="205" r="1.5" fill="#00F0FF" opacity="0.8" />
  </g>

  <!-- Tensile Spider-Web Strands in Background -->
  <g class="web-line" stroke="#00F0FF" stroke-width="1" opacity="0.3" fill="none">
    <path d="M 550 0 Q 720 110 1000 70" />
    <path d="M 680 0 Q 780 160 1000 180" />
    <path d="M 620 40 Q 820 90 950 0" />
    <path d="M 740 60 L 780 130" />
    <path d="M 830 75 L 870 150" />
    <path d="M 910 80 L 945 165" />
    <line x1="450" y1="360" x2="1000" y2="415" stroke="#FF1E46" stroke-width="0.8" opacity="0.25" />
  </g>

  <!-- Left Side: Comic Typography & Identity -->
  <g transform="translate(60, 45)">

    <!-- Comic Issue Header Badge -->
    <g>
      <rect x="0" y="0" width="105" height="24" fill="#FF1E46" rx="3" />
      <text x="52" y="16" font-family="'Impact', 'Arial Black', -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">ISSUE // 09</text>

      <rect x="115" y="0" width="135" height="24" fill="#0B1220" stroke="#00F0FF" stroke-width="1.2" rx="3" />
      <circle cx="128" cy="12" r="4" fill="#00F0FF" filter="url(#neonCyanGlow)" />
      <text x="140" y="16" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="1">MULTIVERSE // IN</text>
    </g>

    <!-- Glitch Background Layer for Title -->
    <g class="glitch-layer">
      <text x="2" y="122" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" font-weight="900" fill="#00F0FF" letter-spacing="4" opacity="0.45">NHR-09</text>
      <text x="-2" y="118" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" font-weight="900" fill="#FF1E46" letter-spacing="4" opacity="0.45">NHR-09</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="120" font-family="'Impact', 'Arial Black', -apple-system, sans-serif" font-size="88" font-weight="900" fill="#FFFFFF" letter-spacing="4">NHR-09</text>

    <!-- Electric Accent Line Under Name -->
    <g>
      <line x1="0" y1="135" x2="340" y2="135" stroke="#FF1E46" stroke-width="4" stroke-linecap="round" />
      <line x1="348" y1="135" x2="440" y2="135" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" filter="url(#neonCyanGlow)" />
      <polygon points="446,131 454,135 446,139" fill="#00F0FF" />
    </g>

    <!-- Tagline (The core quote) -->
    <g transform="translate(0, 185)">
      <!-- Spray-paint / Stencil Quote Box -->
      <path d="M 0 0 L 480 0 L 465 42 L 0 42 Z" fill="#101524" stroke="#FF1E46" stroke-width="1.4" opacity="0.95" />
      <rect x="0" y="0" width="6" height="42" fill="#FF1E46" />
      
      <!-- Spider Emblem Mini Accent -->
      <path d="M 22 21 L 28 15 L 34 21 L 28 27 Z" fill="#FF1E46" />
      <circle cx="28" cy="21" r="3" fill="#FFFFFF" />

      <text x="44" y="27" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="800" fill="#F5F7FA" letter-spacing="0.5">
        lets do this one last time yo ,
      </text>
    </g>

    <!-- Developer Sub-identity & Mission Motto -->
    <g transform="translate(0, 255)">
      <text x="0" y="0" font-family="'SF Pro Display', -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#00F0FF" letter-spacing="2">
        WHAT'S UP DANGER // BUILD · BREAK · REBUILD
      </text>
      <text x="0" y="24" font-family="'SF Pro Display', -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#8E99AC" letter-spacing="0.5">
        AI/ML Engineer · Intelligent Systems · High-Scale Backends
      </text>
    </g>

    <!-- Quick Badges Row -->
    <g transform="translate(0, 310)">
      <!-- Badge 1: Spidey-Sense Status -->
      <g>
        <rect x="0" y="0" width="150" height="26" rx="4" fill="#141A29" stroke="#00F0FF" stroke-width="1" />
        <circle cx="14" cy="13" r="3.5" fill="#00F0FF" filter="url(#neonCyanGlow)" />
        <text x="26" y="17" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#F0F4F8" letter-spacing="1">SPIDER-SENSE // ON</text>
      </g>
      <!-- Badge 2: Tech Core -->
      <g transform="translate(162, 0)">
        <rect x="0" y="0" width="130" height="26" rx="4" fill="#141A29" stroke="#FF1E46" stroke-width="1" />
        <circle cx="14" cy="13" r="3.5" fill="#FF1E46" filter="url(#neonRedGlow)" />
        <text x="26" y="17" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#F0F4F8" letter-spacing="1">RAG · LLM · SOLANA</text>
      </g>
      <!-- Badge 3: Base -->
      <g transform="translate(304, 0)">
        <rect x="0" y="0" width="125" height="26" rx="4" fill="#141A29" stroke="#3A4659" stroke-width="1" />
        <text x="14" y="17" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#A4B3C6" letter-spacing="0.8">PUNE // 411037</text>
      </g>
    </g>

  </g>

  <!-- Right Side: Spider-Man / Miles Morales Mask Artwork -->
  <g transform="translate(775, 205)">

    <!-- Spider-Sense Electric Radiating Waves -->
    <g class="sense-wave" filter="url(#sensePulse)">
      <!-- Arcs of Spider-Sense -->
      <path d="M -110 -150 Q 0 -195 110 -150" fill="none" stroke="#FF1E46" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />
      <path d="M -130 -120 Q 0 -170 130 -120" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.8" />
      <path d="M -90 -170 Q 0 -215 90 -170" fill="none" stroke="#FF1E46" stroke-width="1.8" opacity="0.6" />
      <!-- Small shock sparks -->
      <polygon points="125,-140 145,-148 135,-135" fill="#00F0FF" />
      <polygon points="-125,-140 -145,-148 -135,-135" fill="#FF1E46" />
      <polygon points="85,-190 100,-205 92,-188" fill="#FF1E46" />
    </g>

    <!-- Mask Base Outer Silhouette (Angled Dramatic Head) -->
    <g>
      <!-- Dark Mask Base -->
      <path d="M 0 -130
               C 55 -130 115 -85 125 -10
               C 135 60 95 140 45 180
               C 15 200 -15 200 -45 180
               C -95 140 -135 60 -125 -10
               C -115 -85 -55 -130 0 -130 Z"
            fill="#090B10"
            stroke="#1B2232"
            stroke-width="3" />

      <!-- Deep Crimson Rim Glow on Mask Edge -->
      <path d="M 0 -128
               C 52 -128 110 -84 120 -10
               C 130 58 92 135 44 176"
            fill="none"
            stroke="#FF1E46"
            stroke-width="3.5"
            opacity="0.85"
            filter="url(#neonRedGlow)" />

      <!-- Cyan Rim Glow on Opposite Side (Spider-Verse dual light) -->
      <path d="M 0 -128
               C -52 -128 -110 -84 -120 -10
               C -130 58 -92 135 -44 176"
            fill="none"
            stroke="#00F0FF"
            stroke-width="3"
            opacity="0.75"
            filter="url(#neonCyanGlow)" />

      <!-- Mask Web Lines (Miles Morales Red Webbing on Black Mask) -->
      <g stroke="#FF1E46" stroke-width="1.5" opacity="0.55" fill="none">
        <!-- Vertical Web Spokes meeting between eyes -->
        <line x1="0" y1="-128" x2="0" y2="188" />
        <path d="M 0 5 Q 35 -60 70 -120" />
        <path d="M 0 5 Q -35 -60 -70 -120" />
        <path d="M 0 5 Q 65 -25 122 -30" />
        <path d="M 0 5 Q -65 -25 -122 -30" />
        <path d="M 0 5 Q 70 50 100 120" />
        <path d="M 0 5 Q -70 50 -100 120" />
        <path d="M 0 5 Q 35 100 30 185" />
        <path d="M 0 5 Q -35 100 -30 185" />

        <!-- Concentric Web Rings -->
        <path d="M -30 -30 Q 0 -45 30 -30 Q 38 10 25 45 Q 0 60 -25 45 Q -38 10 -30 -30" />
        <path d="M -60 -65 Q 0 -88 60 -65 Q 75 10 50 90 Q 0 115 -50 90 Q -75 10 -60 -65" />
        <path d="M -90 -95 Q 0 -120 90 -95 Q 112 15 75 135 Q 0 165 -75 135 Q -112 15 -90 -95" />
      </g>

      <!-- Expressive Spider-Man Lenses / Eyes -->
      <g class="eye-glow">
        <!-- LEFT EYE -->
        <!-- Thick Black Frame / Bevel -->
        <path d="M -16 -8
                 L -95 -28
                 C -102 15 -85 55 -38 72
                 C -22 62 -14 30 -16 -8 Z"
              fill="#06070B"
              stroke="#FF1E46"
              stroke-width="3" />

        <!-- Inner White/Cyan Lens -->
        <path d="M -22 -2
                 L -88 -20
                 C -92 12 -80 48 -42 62
                 C -28 50 -20 25 -22 -2 Z"
              fill="url(#eyeReflection)" />

        <!-- RIGHT EYE -->
        <!-- Thick Black Frame / Bevel -->
        <path d="M 16 -8
                 L 95 -28
                 C 102 15 85 55 38 72
                 C 22 62 14 30 16 -8 Z"
              fill="#06070B"
              stroke="#00F0FF"
              stroke-width="3" />

        <!-- Inner White/Cyan Lens -->
        <path d="M 22 -2
                 L 88 -20
                 C 92 12 80 48 42 62
                 C 28 50 20 25 22 -2 Z"
              fill="url(#eyeReflection)" />

        <!-- Lens Highlight Glint -->
        <polygon points="-82,-12 -65,-16 -75,10" fill="#FFFFFF" opacity="0.8" />
        <polygon points="82,-12 65,-16 75,10" fill="#FFFFFF" opacity="0.8" />
      </g>

      <!-- Miles Morales Graffiti Spider Emblem Stencil at base of neck / collar -->
      <g transform="translate(0, 145) scale(0.65)">
        <path d="M 0 -22 L 6 -12 L 14 -16 L 8 -5 L 15 5 L 8 8 L 12 25 L 5 18 L 0 24 L -5 18 L -12 25 L -8 8 L -15 5 L -8 -5 L -14 -16 L -6 -12 Z"
              fill="#FF1E46"
              filter="url(#neonRedGlow)" />
        <circle cx="0" cy="-2" r="4.5" fill="#FFFFFF" />
      </g>

    </g>

  </g>

  <!-- Atmospheric Floating Luminous Dust Particles -->
  <circle cx="210" cy="180" r="1.8" fill="#FF1E46" class="particle-1" filter="url(#neonRedGlow)" />
  <circle cx="480" cy="80" r="2.2" fill="#00F0FF" class="particle-2" filter="url(#neonCyanGlow)" />
  <circle cx="620" cy="340" r="1.5" fill="#FF1E46" class="particle-3" />
  <circle cx="340" cy="280" r="2.5" fill="#00F0FF" class="particle-1" filter="url(#neonCyanGlow)" />
  <circle cx="920" cy="110" r="2" fill="#FFFFFF" class="particle-2" />
  <circle cx="710" cy="370" r="1.8" fill="#00F0FF" class="particle-3" />

  <!-- Outer Comic Panel Border -->
  <rect x="1.5" y="1.5" width="997" height="417" rx="15" fill="none" stroke="#252D3D" stroke-width="2" />
  <rect x="0" y="0" width="1000" height="420" rx="16" fill="none" stroke="#FF1E46" stroke-width="1.2" opacity="0.4" />

  <!-- Corner Comic Screws / Cuts -->
  <polygon points="0,0 24,0 0,24" fill="#FF1E46" opacity="0.8" />
  <polygon points="1000,420 976,420 1000,396" fill="#00F0FF" opacity="0.8" />
</svg>
