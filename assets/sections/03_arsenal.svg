<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 142" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', Courier, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
      .badge-bg { fill: #11141B; stroke: #212733; stroke-width: 1; rx: 6; }
      .badge-text { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 11.5px; font-weight: 500; fill: #D0D7DE; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="736" height="142" fill="#000000" />

  <!-- Section Header: // ARSENAL [03] -->
  <g transform="translate(30, 32)">
    <text x="0" y="0" class="mono" font-size="15" font-weight="700" fill="#E52E2E" letter-spacing="1">//</text>
    <text x="24" y="0" class="mono" font-size="14" font-weight="700" fill="#F0F3F6" letter-spacing="1">ARSENAL</text>
    <text x="676" y="0" class="mono" font-size="12.5" font-weight="600" fill="#505763" text-anchor="end">[03]</text>
  </g>

  <!-- Row 1 Badges -->
  <g transform="translate(30, 56)">
    <!-- Python -->
    <rect x="0" y="0" width="70" height="30" class="badge-bg" />
    <text x="35" y="15" class="badge-text">Python</text>

    <!-- Java -->
    <rect x="80" y="0" width="58" height="30" class="badge-bg" />
    <text x="109" y="15" class="badge-text">Java</text>

    <!-- TypeScript -->
    <rect x="148" y="0" width="100" height="30" class="badge-bg" />
    <text x="198" y="15" class="badge-text">TypeScript</text>

    <!-- C++ -->
    <rect x="258" y="0" width="52" height="30" class="badge-bg" />
    <text x="284" y="15" class="badge-text">C++</text>

    <!-- Rust -->
    <rect x="320" y="0" width="58" height="30" class="badge-bg" />
    <text x="349" y="15" class="badge-text">Rust</text>
  </g>

  <!-- Row 2 Badges -->
  <g transform="translate(30, 96)">
    <!-- Spring Boot -->
    <rect x="0" y="0" width="104" height="30" class="badge-bg" />
    <text x="52" y="15" class="badge-text">Spring Boot</text>

    <!-- FastAPI -->
    <rect x="114" y="0" width="76" height="30" class="badge-bg" />
    <text x="152" y="15" class="badge-text">FastAPI</text>

    <!-- React -->
    <rect x="200" y="0" width="64" height="30" class="badge-bg" />
    <text x="232" y="15" class="badge-text">React</text>

    <!-- Next.js -->
    <rect x="274" y="0" width="74" height="30" class="badge-bg" />
    <text x="311" y="15" class="badge-text">Next.js</text>

    <!-- PostgreSQL -->
    <rect x="358" y="0" width="100" height="30" class="badge-bg" />
    <text x="408" y="15" class="badge-text">PostgreSQL</text>

    <!-- Docker -->
    <rect x="468" y="0" width="72" height="30" class="badge-bg" />
    <text x="504" y="15" class="badge-text">Docker</text>
  </g>
</svg>
