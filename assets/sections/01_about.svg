<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 150" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', Courier, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
      .crimson { fill: #E52E2E; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="736" height="150" fill="#000000" />

  <!-- Section Header: // ABOUT [01] -->
  <g transform="translate(30, 32)">
    <text x="0" y="0" class="mono" font-size="15" font-weight="700" fill="#E52E2E" letter-spacing="1">//</text>
    <text x="24" y="0" class="mono" font-size="14" font-weight="700" fill="#F0F3F6" letter-spacing="1">ABOUT</text>
    <text x="676" y="0" class="mono" font-size="12.5" font-weight="600" fill="#505763" text-anchor="end">[01]</text>
  </g>

  <!-- Left Column: Identity & Focus -->
  <g transform="translate(30, 72)">
    <text x="0" y="0" class="sans" font-size="14.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">Developer &amp; Systems Architect</text>
    <text x="0" y="24" class="mono" font-size="11.5" fill="#8B949E" letter-spacing="0.1">Focusing on intelligent architectures, high-performance</text>
    <text x="0" y="42" class="mono" font-size="11.5" fill="#8B949E" letter-spacing="0.1">backends, and decentralized systems.</text>
  </g>

  <!-- Right Column: First Principles Quote with Crimson Bar -->
  <g transform="translate(426, 62)">
    <!-- Red Accent Vertical Bar -->
    <line x1="0" y1="2" x2="0" y2="58" stroke="#E52E2E" stroke-width="2" stroke-linecap="round" />

    <!-- Quote Text -->
    <text x="18" y="16" class="mono" font-size="12" font-style="italic" fill="#BAC2CC" letter-spacing="0.2">“ Break complex systems down</text>
    <text x="18" y="34" class="mono" font-size="12" font-style="italic" fill="#BAC2CC" letter-spacing="0.2">  to first principles —</text>
    <text x="18" y="52" class="mono" font-size="12" font-style="italic" fill="#BAC2CC" letter-spacing="0.2">  then rebuild them better. ”</text>
  </g>

  <!-- Bottom Hairline Divider -->
  <line x1="30" y1="146" x2="706" y2="146" stroke="#161B22" stroke-width="1" />
</svg>
